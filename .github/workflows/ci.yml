name: FoodFlow AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall src api tests

      - name: Run tests
        run: pytest -q

      - name: Generate synthetic data
        run: python data/generate_data.py

      - name: Run EDA
        run: python src/eda.py

      - name: Train cancellation model
        run: python src/train_cancellation.py

      - name: Evaluate cancellation model
        run: python src/evaluate_cancellation.py

      - name: Run NLP baseline
        run: python src/sentiment.py
